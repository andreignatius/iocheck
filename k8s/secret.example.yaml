# TEMPLATE ONLY — do NOT apply this file and do NOT put real secrets here (§S2).
# The real Secret is created from .env at deploy time:  make secret
# (kubectl create secret generic ... --from-literal=... from your gitignored .env)
#
# Shown here so the required keys are documented/reviewable.
apiVersion: v1
kind: Secret
metadata:
  name: iocheck-secrets
  namespace: iocheck
type: Opaque
stringData:
  postgres-super-password: "<postgres superuser password>"   # Postgres container admin
  app-db-password: "<iocheck_app role password>"             # app's DB login + init.sh
  redis-password: "<redis requirepass>"
  ioc-admin-api-key: "<X-API-Key for POST /ioc>"
