# Network segmentation (§S5). Enforced by Calico (kindnet would silently ignore these).
# Posture: default-deny everything in the namespace, then allow only what's needed.

# 1) Default-deny all ingress + egress for every pod in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: iocheck
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2) Allow DNS egress (kube-dns) for all pods — the always-forgotten rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: iocheck
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 3) iocheck app may egress ONLY to Postgres and Redis (plus DNS above).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iocheck-egress-datastores
  namespace: iocheck
spec:
  podSelector:
    matchLabels:
      app: iocheck
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: postgres } }
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector: { matchLabels: { app: redis } }
      ports:
        - { protocol: TCP, port: 6379 }
---
# 4) Postgres accepts ingress ONLY from iocheck pods (§S5 — the explicit ask).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress-from-iocheck
  namespace: iocheck
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: iocheck } }
      ports:
        - { protocol: TCP, port: 5432 }
---
# 5) Redis accepts ingress ONLY from iocheck pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress-from-iocheck
  namespace: iocheck
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: iocheck } }
      ports:
        - { protocol: TCP, port: 6379 }
---
# 6) iocheck app ingress. Two separate rules for two separate ports (§S8):
#    - 3000 (public API + kubelet probes): left open on the port for the demo/port-forward;
#      PROD would restrict `from` to the ingress controller.
#    - 9464 (/metrics): monitoring namespace ONLY. NetworkPolicy is L3/L4 and can't gate an
#      HTTP path, so metrics live on their own port and this rule keeps SOC-activity metadata
#      (verdict rates, request tempo) off the public port and away from every non-Prometheus peer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iocheck-ingress
  namespace: iocheck
spec:
  podSelector:
    matchLabels:
      app: iocheck
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 3000 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring   # auto-set on every ns since k8s 1.22
      ports:
        - { protocol: TCP, port: 9464 }
