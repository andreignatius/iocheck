# Non-secret configuration (secrets live in the iocheck-secrets Secret, made by `make secret`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: iocheck-config
  namespace: iocheck
data:
  NODE_ENV: "production"
  PORT: "3000"
  METRICS_PORT: "9464"              # /metrics on a separate internal port (§S8), monitoring-only via NetworkPolicy
  LOG_LEVEL: "info"
  BODY_LIMIT: "8kb"
  # in-cluster service DNS names
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "iocheck"
  POSTGRES_USER: "iocheck_app"      # app connects as the least-priv role (§S2)
  PG_POOL_MAX: "10"
  PG_CONNECTION_TIMEOUT_MS: "10000" # let p99 climb cleanly under pool saturation (§6a#3)
  STORE_LOOKUP_LATENCY_MS: "700"    # DEMO: model a slow remote reputation/feed lookup on cache miss (§6a)
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CACHE_TTL_SECONDS: "300"
  NEGATIVE_CACHE_TTL_SECONDS: "60"
  SHUTDOWN_DRAIN_MS: "10000"
  # consumed by the Postgres init container/script to CREATE the app role
  APP_DB_USER: "iocheck_app"
