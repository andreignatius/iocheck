# The iocheck service.
apiVersion: v1
kind: Service
metadata:
  name: iocheck
  namespace: iocheck
  labels:
    app: iocheck
spec:
  selector:
    app: iocheck
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iocheck
  namespace: iocheck
  labels:
    app: iocheck
spec:
  replicas: 2                       # shipped floor (§O4); prod would be 3 for drain headroom
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0             # surge a new pod up before removing an old one (§O4)
      maxSurge: 1
  selector:
    matchLabels:
      app: iocheck
  template:
    metadata:
      labels:
        app: iocheck
    spec:
      serviceAccountName: iocheck
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30      # covers preStop sleep + in-flight drain (§O2)
      # Spread the pods across nodes so a node loss can't breach the PDB (§O5).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: iocheck
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532            # distroless 'nonroot'
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iocheck
          image: iocheck:0.1.5
          imagePullPolicy: IfNotPresent     # kind-loaded image; never pull from a registry (#5)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true     # app writes nothing to disk (logs to stdout)
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: iocheck-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: iocheck-secrets, key: app-db-password }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: iocheck-secrets, key: redis-password }
            - name: IOC_ADMIN_API_KEY
              valueFrom:
                secretKeyRef: { name: iocheck-secrets, key: ioc-admin-api-key }
          ports:
            - name: http
              containerPort: 3000
            - name: metrics             # /metrics only; NetworkPolicy restricts to monitoring ns (§S8)
              containerPort: 9464
          lifecycle:
            preStop:
              # Distroless has no shell/sleep -> use the bundled node to sleep ~5s.
              # This runs to completion BEFORE SIGTERM, letting endpoint removal
              # propagate while the app still serves (§O2).
              exec:
                command: ["/nodejs/bin/node", "-e", "setTimeout(()=>{}, 5000)"]
          # timeoutSeconds is set explicitly on every probe: it DEFAULTS to 1s, and a briefly
          # CPU-starved event loop (e.g. a cold start on a resource-constrained host) can miss a
          # 1s /healthz and trip a needless restart cascade — observed in the from-scratch e2e
          # (logs/E2E-clean-run.log). 3–5s tolerates transient slowness while still catching a
          # genuinely dead process (liveness still restarts after failureThreshold×periodSeconds).
          startupProbe:                       # allow a slow first start before liveness bites
            httpGet: { path: /healthz, port: http }
            periodSeconds: 1
            timeoutSeconds: 3
            failureThreshold: 45              # up to ~45s for a slow first start on a loaded host
          livenessProbe:                      # process-only (§O3) — never restart on a dep blip
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5                 # tolerate a briefly CPU-starved event loop (e2e finding)
            failureThreshold: 3
          readinessProbe:                     # PG hard / Redis soft (§O3)
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # CPU request right-sized to the app's actual working set under load (§6a#1 co-tune):
            # usage bursts to ~130m during the storm ramp, so 200m = peak + headroom. Even that
            # burst is ~65% of a 200m request — under the 70% HPA trigger (140m) — so the CPU-HPA
            # never fires while p99 breaches. CPU is genuinely below threshold: the app is I/O-bound.
            requests: { cpu: "200m", memory: "128Mi" }
            # CPU limit 500m: usage is ~3x under it → no CFS throttling to confound the thesis
            # (§6a#4). mem limit 512Mi for load-test headroom — avoid OOM mid-run (§6a#15).
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: tmp
              mountPath: /tmp                 # writable scratch (rootfs is read-only)
      volumes:
        - name: tmp
          emptyDir: {}
