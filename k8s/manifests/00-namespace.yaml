# Namespace with Pod Security Admission = restricted (§S4): every pod here must run
# non-root, drop all caps, no privilege escalation, seccomp RuntimeDefault, etc.
apiVersion: v1
kind: Namespace
metadata:
  name: iocheck
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Dedicated least-privilege ServiceAccount; the service never calls the k8s API,
# so its token is not mounted (§S4).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iocheck
  namespace: iocheck
automountServiceAccountToken: false
