# Local dev stack: iocheck service + Postgres + Redis.
# Secrets come from .env (gitignored); ${VAR:?msg} fails fast if one is missing.
name: iocheck

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Superuser for the container + init script (distinct from the app role).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?set POSTGRES_SUPER_PASSWORD in .env}
      POSTGRES_DB: iocheck
      # Consumed by init.sh to CREATE the least-privilege app role from env (§S2).
      APP_DB_USER: ${APP_DB_USER:-iocheck_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iocheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
              "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      # $$ escapes to a literal $ so the container shell expands its own env var
      # (keeps the password out of the rendered compose config).
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  iocheck:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      METRICS_PORT: 9464
      LOG_LEVEL: info
      BODY_LIMIT: 8kb
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: iocheck
      # App connects as the least-privilege role, NOT the superuser (§S2).
      POSTGRES_USER: ${APP_DB_USER:-iocheck_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      PG_POOL_MAX: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_TTL_SECONDS: 300
      NEGATIVE_CACHE_TTL_SECONDS: 60
      IOC_ADMIN_API_KEY: ${IOC_ADMIN_API_KEY:?set IOC_ADMIN_API_KEY in .env}
      SHUTDOWN_DRAIN_MS: 10000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "9464:9464"   # /metrics (separate port, §S8)
    healthcheck:
      # Distroless has no shell/curl — use the bundled node binary directly.
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
